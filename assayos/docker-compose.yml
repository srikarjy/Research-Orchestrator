services:
  # ==========================================
  # AssayOS - Unified Platform (Single Container)
  # ==========================================
  assayos:
    build:
      context: ./assayos
      dockerfile: Dockerfile
    ports:
      - "8080:8080"  # Unified API Gateway + UI
    environment:
      - ASSAYOS_ENV=production
      - SERVER_PORT=8080
      - DATABASE_DSN=postgres://assayos:assayos@postgres:5432/assayos?sslmode=disable
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - WORKFLOWS_ENABLED=true
      - BIOLAB_ENABLED=true
      - ALETHEIA_ENABLED=true
      - ALETHEIA_ENDPOINT=http://localhost:8000
      - PLUGIN_DIR=/app/plugins
      - LOG_LEVEL=info
    volumes:
      - assayos-data:/data
      - assayos-sandbox:/tmp/assayos-sandbox
      - assayos-plugins:/app/plugins
      - assayos-logs:/var/log/assayos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

  # ==========================================
  # PostgreSQL - Shared Event Store
  # ==========================================
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=assayos
      - POSTGRES_PASSWORD=assayos
      - POSTGRES_DB=assayos
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./assayos/deployments/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assayos -d assayos"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  # ==========================================
  # Redis - Cache & Pub/Sub
  # ==========================================
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  # ==========================================
  # OPA - Authorization (Optional)
  # ==========================================
  opa:
    image: openpolicyagent/opa:latest
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=info"
      - "/policies"
    volumes:
      - ./assayos/deployments/opa:/policies:ro
    ports:
      - "8181:8181"
    profiles:
      - with-auth
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/health"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  default:
    name: assayos-network

volumes:
  assayos-data:
  assayos-sandbox:
  assayos-plugins:
  assayos-logs:
  postgres-data:
  redis-data: