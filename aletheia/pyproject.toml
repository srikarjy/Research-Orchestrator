[project]
name = "aletheia"
version = "0.1.0"
description = "Reasoning plane for Research Orchestrator - LangGraph multi-agent system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]