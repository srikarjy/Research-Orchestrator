server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy for live demo
    location /api/ {
        proxy_pass http://workflow-engine:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}