version: '3.8'

services:
  # ==========================================
  # ALETHEIA: Grounded Reasoning + Single-Call Debate
  # ==========================================
  aletheia:
    build:
      context: ../Aletheia
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://aletheia:aletheia@aletheia-db:5432/aletheia
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MOCK_RETRIEVAL=true
      - MOCK_EMBEDDINGS=true
      - MOCK_LLM=true
    depends_on:
      aletheia-db:
        condition: service_healthy
    networks:
      - research-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  aletheia-db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=aletheia
      - POSTGRES_PASSWORD=aletheia
      - POSTGRES_DB=aletheia
    ports:
      - "55432:5432"
    volumes:
      - aletheia-pgdata:/var/lib/postgresql/data
      - ../Aletheia/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - research-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aletheia -d aletheia"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # ORCHESTRATOR: Workflow Engine + Planner + API Gateway
  # ==========================================
  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=development
      - SERVER_PORT=8080
      - ORCH_DATABASE_DSN=postgres://orchestrator:orchestrator@postgres:5432/orchestrator?sslmode=disable
      - ORCH_REDIS_ADDR=redis:6379
      - ORCH_BIOLAB_MCP_URL=http://biolab-mcp:8081
      - ORCH_ALETHEIA_URL=http://aletheia:8000
      - ORCH_LOG_LEVEL=info
      - ORCH_WORKFLOW_ENGINE_DSN=postgres://workflow:workflow@postgres:5432/workflow?sslmode=disable
      - ORCH_WORKFLOW_ENGINE_STREAM=workflow-steps
      - ORCH_WORKFLOW_ENGINE_GROUP=workers
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      biolab-mcp:
        condition: service_healthy
      aletheia:
        condition: service_healthy
      workflow-engine-migrate:
        condition: service_completed_successfully
    networks:
      - research-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # BIOLAB MCP: Real Tools (PubMed, UniProt, PDB, FoldX, Vina, Critic)
  # ==========================================
  biolab-mcp:
    build:
      context: .
      dockerfile: biolab-mcp-server/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - USE_REAL_APIS=true
      - PUBMED_API_KEY=
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - research-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # DURABLE EXECUTION: workflow-Engine (real repo, git submodule at
  # ./workflow-engine — see deploy/workflow-engine.Dockerfile). Shares this
  # compose's postgres+redis rather than the standalone repo's own
  # docker-compose.yml pair, so orchestrator's wfengine client and this
  # worker are actually talking to the same durable state.
  # ==========================================
  workflow-engine-migrate:
    build:
      context: .
      dockerfile: deploy/workflow-engine.Dockerfile
    entrypoint: ["./migrate"]
    command: ["up"]
    environment:
      - DATABASE_URL=postgres://workflow:workflow@postgres:5432/workflow?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - research-net
    restart: "no"

  workflow-engine-worker:
    build:
      context: .
      dockerfile: deploy/workflow-engine.Dockerfile
    command:
      - "-postgres=postgres://workflow:workflow@postgres:5432/workflow?sslmode=disable"
      - "-redis=redis:6379"
      - "-stream=workflow-steps"
      - "-group=workers"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      workflow-engine-migrate:
        condition: service_completed_successfully
    networks:
      - research-net
    restart: unless-stopped

  # ==========================================
  # INFRASTRUCTURE
  # ==========================================
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=orchestrator
      - POSTGRES_PASSWORD=orchestrator
      - POSTGRES_DB=orchestrator
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - research-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator -d orchestrator"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - research-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ==========================================
  # UI: React Frontend
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://orchestrator:8080
    depends_on:
      orchestrator:
        condition: service_healthy
    networks:
      - research-net

networks:
  research-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  aletheia-pgdata: